[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm install --include=optional",
    "chmod -R +x node_modules/.bin",
    "npm run build"
]

[start]
cmd = "php artisan storage:link --force || true && php artisan package:discover --ansi && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=$PORT"
